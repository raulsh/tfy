version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/store/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        emit_json_tags: true
        json_tags_case_style: "snake"
        emit_empty_slices: true
        emit_interface: false
